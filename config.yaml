# System settings
system:
  n_vars: 3
  first_order: true
  ode_order: null  # only if first_order is false
  var_names: ["P", "E", "M"]

# Integration settings
integration:
  t_start: 0.0
  t_end: 300.0
  num_points: 3000
  step_size: 0.1
  show_progress: true
  compute_boundary: null # set manual boundary size

# Initial conditions
ic_grid:
  center: [0.0, 0.0, 0.0]
  spread: 4.0
  ics_per_var: [16, 1, 16]

# 3D visualization
plot_3d:
  projection_axes: [0, 1, 3]   # 0 = time, 1 = var1, 2 = var2, ...
  color_by: 2
  figsize: [6, 6]
  title: "Phase Space"
  colormap: "viridis"
  save_path: "./Plots/3D/3D_NSYS_ODE.png"
  save_plot: true
  max_boundary: null

threejs:
  enabled: false
  save_path: "./Plots/3D/3D_NSYS_ODE.html"
  background_color: "#ffffff"
  point_size: 2.0

# 2D phase portrait (from ODE_Viewer.ipynb)
plot_2d:
  xmin: -7
  xmax: 7
  ymin: -7
  ymax: 7
  step: 0.01
  num_sx: 20
  num_sy: 5
  show_vectors: true
  vector_type: "vector"  # "vector" or "slope"
  line_size: 0.75
  scale: "linear"

# Poincaré section (from ODE_2System_Viewer.ipynb)
poincare:
  enabled: true
  plane: [0, 0, 1, -100.0]  # a*t + b*x + c*y + d = 0
  epsilon: 1e-18
  show_2d: true
  show_3d: false
  up_save_path: "./Plots/2D/poincare_plot_up.svg"
  down_save_path: "./Plots/2D/poincare_plot_down.svg"
  point_size: 0.6
  flip_x: true
  flip_y: false

# Poincaré animation
animation:
  enabled: true
  start_plane: [1, 0, 0, -0.01]
  end_plane: [1, 0, 0, -299.99]
  poincare_animation_duration: 10
  poincare_animation_fps: 12
  poincare_animation_trail: 3
  poincare_animation_save: "./Plots/2D/poincare_animation.html"
  max_animation_size: 64.0
